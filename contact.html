<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>melio — contact</title>
<link rel="icon" type="image/png" href="pfp.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #eceae5;
  --text: #1a1814;
  --muted: #6b6760;
  --subtle: #aaa8a4;
  --card: rgba(255,255,255,0.48);
  --border: rgba(255,255,255,0.68);
  --glass: rgba(255,255,255,0.32);
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', system-ui, sans-serif;
  font-weight: 300;
  min-height: 100vh;
  opacity: 0;
  animation: fadeIn 0.5s ease forwards;
}
@keyframes fadeIn { to { opacity: 1; } }

.blobs { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.blob { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.32; }
.b1 { width: 800px; height: 800px; background: #cec3b6; top: -200px; right: -150px; }
.b2 { width: 600px; height: 600px; background: #b8c8b4; bottom: -100px; left: -120px; }
.b3 { width: 500px; height: 500px; background: #c0b8d0; top: 40%; right: 10%; }

nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 200;
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 40px;
  background: rgba(236,234,229,0.72);
  backdrop-filter: blur(28px) saturate(1.6);
  -webkit-backdrop-filter: blur(28px) saturate(1.6);
  border-bottom: 1px solid rgba(255,255,255,0.6);
}
.logo { font-size: 1.05rem; font-weight: 600; color: var(--text); text-decoration: none; letter-spacing: -0.01em; text-transform: lowercase; }
.nav-links { display: flex; gap: 28px; list-style: none; }
.nav-links a { font-size: 0.74rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); text-decoration: none; transition: color 0.2s; }
.nav-links a:hover, .nav-links a.active { color: var(--text); }

/* ART BG */
.art-bg {
  position: fixed; inset: 0; z-index: 0;
  display: flex; align-items: stretch;
}
.art-bg img {
  position: absolute; right: 0; top: 0; bottom: 0;
  width: 55%; height: 100%;
  object-fit: cover; object-position: center top;
  opacity: 0.22;
  filter: saturate(0.7) brightness(1.05);
}
.art-bg-fade {
  position: absolute; inset: 0;
  background: linear-gradient(to right, var(--bg) 38%, transparent 75%);
}

/* PAGE */
.page {
  position: relative; z-index: 1;
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 110px 40px 80px;
}

.wrap {
  width: 100%; max-width: 560px;
}

/* CARD */
.info-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 22px; padding: 44px 40px;
  backdrop-filter: blur(36px) saturate(1.5);
  -webkit-backdrop-filter: blur(36px) saturate(1.5);
  box-shadow: 0 8px 48px rgba(0,0,0,0.08), inset 0 1.5px 0 rgba(255,255,255,0.9);
  display: flex; flex-direction: column; gap: 32px;
}

.pfp-wrap { display: flex; justify-content: center; }
.pfp {
  width: 72px; height: 72px; border-radius: 50%; object-fit: cover;
  border: 2px solid rgba(255,255,255,0.8);
  box-shadow: 0 0 0 4px rgba(255,255,255,0.3), 0 4px 16px rgba(0,0,0,0.08);
  background: #d8d0c6;
}

.info-top { text-align: center; }
.info-name { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; text-transform: lowercase; margin-bottom: 5px; }
.info-bio { font-size: 0.8rem; color: var(--muted); line-height: 1.65; }

/* contact rows */
.contact-rows { display: flex; flex-direction: column; gap: 0; }

.crow {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 0;
  border-bottom: 1px solid rgba(0,0,0,0.07);
  text-decoration: none; color: var(--text);
  transition: 0.2s;
}
.crow:first-child { border-top: 1px solid rgba(0,0,0,0.07); }
.crow:hover { opacity: 0.7; }

.crow-icon {
  width: 36px; height: 36px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  border: 1px solid rgba(255,255,255,0.65);
  backdrop-filter: blur(10px);
  font-size: 1rem;
}

/* platform colours */
.icon-discord { background: rgba(88,101,242,0.12); }
.icon-roblox  { background: rgba(26,24,20,0.08); }
.icon-email   { background: rgba(200,168,130,0.15); }

.crow-info {}
.crow-label { font-size: 0.63rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--subtle); }
.crow-val { font-size: 0.85rem; font-weight: 400; margin-top: 1px; }

/* discord copy button */
.copy-btn {
  margin-left: auto; font-family: 'Inter', sans-serif;
  font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--subtle); background: rgba(255,255,255,0.5);
  border: 1px solid rgba(255,255,255,0.65); border-radius: 8px;
  padding: 5px 12px; cursor: pointer; transition: 0.18s; flex-shrink: 0;
}
.copy-btn:hover { background: rgba(255,255,255,0.8); color: var(--text); }
.copy-btn.copied { color: #3a6b4a; }

footer {
  position: relative; z-index: 10;
  padding: 26px 40px;
  border-top: 1px solid rgba(0,0,0,0.07);
  display: flex; align-items: center; justify-content: space-between;
}
.footer-logo { font-size: 0.9rem; font-weight: 600; text-transform: lowercase; letter-spacing: -0.01em; }
.footer-copy { font-size: 0.7rem; color: var(--subtle); }

@media (max-width: 700px) {
  nav { padding: 16px 20px; }
  .page { padding: 100px 20px 60px; }
  .art-bg img { width: 100%; opacity: 0.12; }
  footer { padding: 22px 20px; }
}
</style>
</head>
<body>
<div class="blobs">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
</div>

<!-- Art background -->
<div class="art-bg">
  <img src="image7.jpg" alt="">
  <div class="art-bg-fade"></div>
</div>

<nav>
  <a href="index.html" class="logo">melio</a>
  <ul class="nav-links">
    <li><a href="gallery.html">Gallery</a></li>
    <li><a href="contact.html" class="active">Contact</a></li>
  </ul>
</nav>

<div class="page">
  <div class="wrap">
    <div class="info-card">
      <div class="pfp-wrap">
        <img src="pfp.png" alt="melio" class="pfp">
      </div>
      <div class="info-top">
        <div class="info-name">melio</div>
        <div class="info-bio">Digital illustrator &amp; character artist. Best way to reach me is Discord — I'm usually pretty quick to respond.</div>
      </div>

      <div class="contact-rows">
        <div class="crow">
          <div class="crow-icon icon-discord">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z" fill="#5865F2"/></svg>
          </div>
          <div class="crow-info">
            <div class="crow-label">Discord</div>
            <div class="crow-val">melioaw</div>
          </div>
          <button class="copy-btn" id="copy-btn" onclick="copyDiscord()">Copy</button>
        </div>
      </div>

      <div style="font-size:0.78rem; color:var(--subtle); line-height:1.6;">
        For commissions, collabs, or anything else — DM me on Discord. I check it daily.
      </div>
    </div>
  </div>
</div>

<footer>
  <span class="footer-logo">melio</span>
  <span class="footer-copy">© 2026 melio</span>
</footer>

<script>
function copyDiscord() {
  navigator.clipboard.writeText('melioaw').then(() => {
    const btn = document.getElementById('copy-btn');
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
  });
}
</script>
</body>
</html>
